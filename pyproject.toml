[project]
name = "iseg-hv-controller"
version = "0.9.0"
authors = [
    { name="Francesco Pompa", email="francesco.pompa@kit.edu" },
]
description = "Tools to deal with HV"
readme = "README.md"
requires-python = ">=3.10.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.10",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "License :: Free To Use But Restricted",
]
keywords = [
    "detector", "neutron", "LNGS", "Gran Sasso", "RADC", "FPGA", "DAQ",
    "IAP", "KIT", "high voltage"
]

dynamic = ["dependencies"]



[tool.setuptools.package-dir]
isegcontroller = "isegcontroller"
configFiles = "configFiles"


[options.packages_data]
"*" = ["pyproject.toml"]
"data_parser" = ["*.yaml"]

[tools.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=64.0", "setuptools-ext"]
# build-backend = "setuptools.build_meta"
build-backend = "setuptools_ext"